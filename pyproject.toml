[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "uir-research"
version = "0.2.0"
description = "Shared typed policy-and-evidence contracts and UIR project evaluation"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["jsonschema>=4", "requests>=2", "rfc8785>=0.1"]

[project.optional-dependencies]
evaluation = ["pytest>=8", "numpy>=2", "scipy>=1.14", "pyyaml>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_trust = ["uir/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "--import-mode=importlib"
