[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uir-research"
version = "0.2.0"
description = "Shared UIR trust and security runtime"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4", "requests>=2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["llm_trust", "llm_trust.*"]
namespaces = false

[tool.setuptools.package-data]
"llm_trust.uir" = ["schema_v2.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
